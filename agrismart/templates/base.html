<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AgriSmart{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('home') }}">AgriSmart</a>
    <nav>
      <a href="{{ url_for('home') }}" class="{{ 'on' if request.endpoint == 'home' }}">Crop advisor</a>
      <a href="{{ url_for('dashboard') }}" class="{{ 'on' if request.endpoint == 'dashboard' }}">Dashboard</a>
      <a href="{{ url_for('history') }}" class="{{ 'on' if request.endpoint == 'history' }}">Saved fields</a>
      <a href="{{ url_for('about') }}" class="{{ 'on' if request.endpoint == 'about' }}">How it works</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <div id="toast" role="status" aria-live="polite"></div>
  <footer class="foot">AgriSmart · SY B.Tech mini project · Python, Flask, SQLite, pandas, NumPy, scikit-learn</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
